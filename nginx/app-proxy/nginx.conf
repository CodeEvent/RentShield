# Fronts the Django dev server at auth.rentshield.local (2026-09-15,
# added so RentShield and Authelia share a parent domain -- rentshield.local
# -- letting Authelia's session cookie (domain: rentshield.local, see
# authelia/configuration.yml) flow as a same-site request instead of the
# cross-site one it was before, when RentShield was only reachable at
# localhost/a bare LAN IP. See the plan file for the full reasoning,
# including why this does NOT make the WebAuthn "add a passkey" ceremony
# work from here too (that's a separate, unrelated browser rule tied to
# Authelia's own hostname, not fixed by this).
#
# Plain TLS termination only -- no branding/sub_filter tricks like
# authelia/nginx/nginx.conf, this is RentShield's own app being served
# as-is.

events {}

http {
    server {
        listen 8443 ssl;
        server_name auth.rentshield.local;

        ssl_certificate     /etc/nginx/certs/auth.rentshield.local.pem;
        ssl_certificate_key /etc/nginx/certs/auth.rentshield.local-key.pem;

        # ZITADEL migration Phase D (2026-09-22) -- the bridge page now
        # lives on auth.rentshield.local and calls back into Django
        # for the two passkey steps (see documents/rentshield_views.py's
        # zitadel_passkey_start_view/verify_view's own comment on why:
        # the admin-level ZITADEL PAT never reaches the browser). Same
        # CORS-for-one-cross-origin-caller pattern as authelia/nginx/
        # nginx.conf's own /api/ location, mirrored in the opposite
        # direction.
        location /zitadel/passkey/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin 'https://auth.rentshield.local:9092' always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin 'https://auth.rentshield.local:9092';
                add_header Access-Control-Allow-Methods 'POST, OPTIONS';
                add_header Access-Control-Allow-Headers 'Content-Type';
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location / {
            # host.docker.internal, not the compose `webserver` service
            # name -- this session runs Django as a bare dev server on
            # the host, not always via compose, and both ways of running
            # it publish to host port 8000, so this reaches either.
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

[project]
name = "docling-service"
version = "0.1.0"
description = "Structured document parsing for rentshield, via IBM/LF AI's Docling (github.com/docling-project/docling)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling~=2.0",
    "fastapi~=0.115.6",
    "uvicorn[standard]~=0.34.0",
    "python-multipart~=0.0.20",
]

[tool.uv]
package = false

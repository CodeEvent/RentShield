# ZITADEL migration Phase A side door (2026-09-22) -- TLS terminates
# here (same mkcert CA as authelia-proxy/app-proxy), plaintext h2c to
# zitadel-api/zitadel-login internally. Pattern (grpc_pass, not
# proxy_pass, for the API -- ZITADEL serves gRPC/Connect-RPC on this
# port, and a plain HTTP reverse proxy silently breaks it) copied from
# ZITADEL's own reverseproxy/nginx docs "TLS Mode External" example,
# fetched directly rather than guessed. No branding/CORS overrides yet
# (unlike authelia/nginx/nginx.conf) -- this only needs to prove ZITADEL
# itself boots and is reachable before Phase B-D build anything real on
# top of it.

events {}

http {
    server {
        listen 9092 ssl;
        http2 on;
        server_name auth.rentshield.local;

        ssl_certificate     /etc/nginx/certs/auth.rentshield.local.pem;
        ssl_certificate_key /etc/nginx/certs/auth.rentshield.local-key.pem;

        location /ui/v2/login {
            proxy_pass http://zitadel-login:3000;
            # $host strips the port -- same bug, same fix, as
            # authelia/nginx/nginx.conf's own comment on this exact
            # mistake (confirmed live here too, 2026-09-22: with $host,
            # ZITADEL's own .well-known/openid-configuration advertised
            # issuer/authorization_endpoint as "https://auth.rentshield.local"
            # with no :9092 at all, regardless of ZITADEL_EXTERNALPORT,
            # breaking the real OIDC login redirect). $http_host
            # preserves whatever the client actually sent.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Phase D (2026-09-22) -- same reasoning as
        # authelia/nginx/nginx.conf's own rentshield-bridge location.
        location = /rentshield-bridge/index.html {
            alias /etc/nginx/rentshield/rentshield-bridge/index.html;
            default_type text/html;
        }

        location / {
            grpc_pass grpc://zitadel-api:8080;
            grpc_set_header Host $http_host;
            grpc_set_header X-Forwarded-Proto https;
        }
    }
}

# Full-stack compose for this fork: paperless-ngx (built from the
# vendored ./Dockerfile) + rentshield's document-parsing services
# (docling-service, optionally deepseek-ocr-service) + its e-signature
# engines (docuseal, opensign). paperless-ngx's own docker/compose/*.yml
# variants (sqlite/postgres/mariadb, with/without Tika) are untouched —
# this file is new, specific to this fork, and deliberately simple
# (sqlite, no Tika).
services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - broker
      - docling-service
      - docuseal
      - opensign
    ports:
      - "8000:8000"
    volumes:
      - pgx-data:/usr/src/paperless/data
      - pgx-media:/usr/src/paperless/media
      - ./consume:/usr/src/paperless/consume
      - jibri-recordings:/usr/src/paperless/jibri-recordings
      # This project's shared local mkcert CA (originally introduced for
      # Authelia, now also what ZITADEL's dev cert is signed by -- kept
      # under authelia/certs/ rather than moved, see that directory's
      # own remaining contents) -- not a real public CA. Python's
      # `requests` (which allauth's OIDC discovery/token/userinfo calls
      # go through) needs to be told to trust it explicitly via
      # REQUESTS_CA_BUNDLE below.
      - ./authelia/certs/rootCA.pem:/usr/src/paperless/authelia-ca.pem:ro
    environment:
      # Passwordless SSO (2026-09-15, now via ZITADEL -- see
      # zitadel_provisioning.py's own header comment for the current
      # architecture).
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      # ZITADEL migration Phase F cleanup (2026-09-22): Authelia has been
      # permanently deleted (requested explicitly, "clean up server
      # space") -- its "authelia" provider_id is gone from here too,
      # not just left registered pointing at a dead URL. Every account
      # created before this cleanup lost its working sign-in path along
      # with it (see signup_email_view's own comment) -- accepted,
      # explicitly, not an oversight.
      #
      # Real bug hit live (2026-09-22): "groups" in SCOPE below was
      # cargo-culted from Authelia's own convention -- ZITADEL doesn't
      # recognize it at all. ctx.v1.user.grants came back structurally
      # null in the setGroupsClaim Action (confirmed by temporarily
      # dumping the raw context as a debug claim, not guessed) with no
      # error, so the Action always silently no-opped. Confirmed against
      # ZITADEL's own docs: role/grant data needs the
      # urn:iam:org:project:roles scope requested here AND "Assert Roles
      # on Authentication" enabled on the project itself (the RentShield
      # project's project_role_assertion, set via the Management API,
      # not tracked in this repo).
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect": {"SCOPE": ["openid", "profile", "email", "urn:iam:org:project:roles"],
        "APPS": [{"provider_id": "zitadel", "name": "RentShield",
        "client_id": "${ZITADEL_OIDC_CLIENT_ID:-}", "secret": "${ZITADEL_OIDC_CLIENT_SECRET:-}",
        "settings": {"server_url": "https://auth.rentshield.local:9092",
        "token_auth_method": "client_secret_post"}}]}}
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
      # Confirmed live (2026-09-22) as genuinely unset in both this file
      # and the bare-host dev launch command -- regular Django
      # username/password login was reachable at /accounts/login/ the
      # whole time, contradicting this app's own stated design
      # ("only biometrics, no passwords" -- see paperless/adapter.py's
      # CustomAccountAdapter.pre_authenticate, which already checks this
      # setting and has since the Authelia days, just never had it set).
      PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
      # RentShield is now also reachable at auth.rentshield.local over
      # HTTPS (2026-09-15, see nginx/app-proxy/) -- Django requires an
      # HTTPS request's Origin to be explicitly trusted for CSRF, unlike
      # the plain-HTTP localhost:8000 path this was unset for before.
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://auth.rentshield.local:8443
      REQUESTS_CA_BUNDLE: /usr/src/paperless/authelia-ca.pem
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: sqlite
      DOCLING_SERVICE_URL: http://docling-service:8010
      DEEPSEEK_OCR_SERVICE_URL: http://deepseek-ocr-service:8011
      DEEPSEEK_OCR_ENABLED: ${DEEPSEEK_OCR_ENABLED:-false}
      # e-signature (rentshield/esign/) — see "Notarization" in the README
      ESIGN_PRIMARY: docuseal
      ESIGN_FALLBACK: opensign
      DOCUSEAL_URL: http://docuseal:3000
      DOCUSEAL_API_TOKEN: ${DOCUSEAL_API_TOKEN:-}
      OPENSIGN_URL: http://opensign:8080
      OPENSIGN_APP_ID: rentshield
      OPENSIGN_MASTER_KEY: ${OPENSIGN_MASTER_KEY:-change-me-in-prod}
      OPENSIGN_SERVICE_USER_ID: ${OPENSIGN_SERVICE_USER_ID:-}
      # Self-hosted Jitsi (jitsi-web et al. below) — see
      # RENTSHIELD_JITSI_BASE_URL's own comment in paperless/settings/
      # __init__.py for why this needs a real domain+HTTPS in production.
      PAPERLESS_RENTSHIELD_JITSI_BASE_URL: ${RENTSHIELD_JITSI_BASE_URL:-http://localhost:8444}
      PAPERLESS_RENTSHIELD_JIBRI_RECORDINGS_DIR: /usr/src/paperless/jibri-recordings

  # Fronts the bare Django dev server at auth.rentshield.local (2026-09-15)
  # -- see nginx/app-proxy/nginx.conf's own header comment for why this
  # exists (shares a parent domain with the identity provider so its
  # session cookie can flow same-site; ZITADEL now, Authelia formerly --
  # permanently removed 2026-09-22, requested explicitly, "clean up
  # server space": the `authelia`/`authelia-proxy` services, the
  # vendored Go fork at vendor/authelia/, and its own config/secrets are
  # all gone, not paused. Every account that only ever had an Authelia
  # passkey lost its working sign-in path along with it -- see
  # signup_email_view's own comment).
  app-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/app-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./authelia/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - auth.rentshield.local

  # ZITADEL: the identity provider (2026-09-22, see /home/giova/.claude/
  # plans/synchronous-finding-storm.md) -- live since Phase F's cutover,
  # permanently addressed at auth.rentshield.local:9092 (deliberately
  # not "auth.rentshield.local" -- see zitadel_provisioning.py's
  # ZITADEL_BRIDGE_URL comment on why moving the domain post-bootstrap
  # was a real, avoidable risk for zero benefit). Service topology
  # (zitadel-api + a separate zitadel-login Next.js container + postgres)
  # and the nginx grpc_pass requirement below are both copied from
  # ZITADEL's own canonical deploy/compose/docker-compose.yml and
  # reverseproxy/nginx docs (fetched directly, not guessed) -- Traefik's
  # path-based routing labels in that reference don't apply here since
  # this project's own nginx TLS-termination pattern (app-proxy) is
  # reused instead.
  zitadel-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD:?set in .env}
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U zitadel"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:latest
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:?set in .env}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: auth.rentshield.local
      ZITADEL_EXTERNALPORT: 9092
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://zitadel:${ZITADEL_DB_PASSWORD}@zitadel-db:5432/zitadel?sslmode=disable"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: "Automatically Initialized IAM_LOGIN_CLIENT"
      # Omitted from the first attempt (2026-09-22) -- confirmed live as
      # the actual reason no login-client.pat ever landed in the shared
      # bootstrap volume: the canonical reference compose file sources
      # this from ${LOGIN_CLIENT_PAT_EXPIRATIONDATE} and never defaults
      # it, so leaving it unset appears to skip PAT generation entirely
      # rather than falling back to a sane default.
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      # Separate general-purpose machine user for zitadel_provisioning.py
      # (Phase C) -- confirmed via ZITADEL's own cmd/setup/steps.yaml
      # reference that FirstInstance.Org.Machine (distinct from
      # .LoginClient above) is a real, fully env-var-addressable section
      # that also grants IAM_OWNER automatically, same file-writing
      # mechanism as the login-client PAT. No steps.yaml needed for this.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: rentshield-provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: "RentShield Provisioning Automation"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/provisioner.pat
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: "https://auth.rentshield.local:9092/ui/v2/login/"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    depends_on:
      zitadel-db:
        condition: service_healthy

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:latest
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: "Host:auth.rentshield.local,X-Forwarded-Proto:https"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy

  zitadel-proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - zitadel-api
      - zitadel-login
    ports:
      - "9092:9092"
    volumes:
      - ./zitadel/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./zitadel/nginx/rentshield-bridge:/etc/nginx/rentshield/rentshield-bridge:ro
      - ./authelia/certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - auth.rentshield.local

  docling-service:
    build:
      context: ./docling-service
    restart: unless-stopped
    ports:
      - "8010:8010"

  # e-signature engines behind the "Notarization Service" add-on
  # (rentshield/esign/) — DocuSeal is primary, OpenSign the automatic
  # fallback. Same two services legacy-v1/docker/docker-compose.yml ran.
  docuseal:
    image: docuseal/docuseal:latest
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - docuseal-data:/data
    environment:
      - FORCE_SSL=false

  opensign-mongo:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - opensign-mongo-data:/data/db

  opensign:
    image: opensign/opensignserver:main
    restart: unless-stopped
    depends_on:
      - opensign-mongo
    ports:
      - "8081:8080"
    volumes:
      - opensign-files:/usr/src/app/files
    environment:
      - NODE_ENV=production
      - APP_ID=rentshield
      - MASTER_KEY=${OPENSIGN_MASTER_KEY:-change-me-in-prod}
      - MONGODB_URI=mongodb://opensign-mongo:27017/opensign
      - SERVER_URL=http://localhost:8081/app
      - PUBLIC_URL=http://localhost:8081

  # Self-hosted video call for the identity-verification Notary review
  # (documents/rentshield_identity/models.py's IdentityVerificationCall)
  # -- official jitsi/docker-jitsi-meet images. This is a genuinely
  # heavier stack than every other service above (XMPP + a video bridge
  # + a headless-Chrome recorder), and this block covers the minimal
  # working set for local/dev use over plain HTTP on localhost (WebRTC
  # allows camera/mic on localhost without TLS) — a real deployment
  # needs a real domain + HTTPS for jitsi-web (see
  # RENTSHIELD_JITSI_BASE_URL's own comment in paperless/settings/
  # __init__.py) and should tighten the XMPP secrets below via a real
  # .env file rather than the checked-in dev defaults.
  jitsi-web:
    image: jitsi/web:stable
    restart: unless-stopped
    ports:
      - "8444:80"
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    environment:
      - ENABLE_HTTPS=0
      - PUBLIC_URL=${RENTSHIELD_JITSI_BASE_URL:-http://localhost:8444}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - ENABLE_RECORDING=1

  jitsi-prosody:
    image: jitsi/prosody:stable
    restart: unless-stopped
    volumes:
      - jitsi-prosody-config:/config
    environment:
      - AUTH_TYPE=internal
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - JICOFO_COMPONENT_SECRET=${JITSI_JICOFO_COMPONENT_SECRET:-devsecret-jicofo-component}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JITSI_JICOFO_AUTH_PASSWORD:-devsecret-jicofo-auth}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JITSI_JVB_AUTH_PASSWORD:-devsecret-jvb-auth}
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JITSI_JIBRI_RECORDER_PASSWORD:-devsecret-jibri-recorder}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JITSI_JIBRI_XMPP_PASSWORD:-devsecret-jibri-xmpp}
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JICOFO_COMPONENT_SECRET=${JITSI_JICOFO_COMPONENT_SECRET:-devsecret-jicofo-component}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JITSI_JICOFO_AUTH_PASSWORD:-devsecret-jicofo-auth}
      - JICOFO_ENABLE_HEALTH_CHECKS=false

  jitsi-jvb:
    image: jitsi/jvb:stable
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    ports:
      - "10000:10000/udp"
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JITSI_JVB_AUTH_PASSWORD:-devsecret-jvb-auth}
      # A real (non-localhost) deployment MUST set this to the host's
      # real public IP -- otherwise clients behind NAT can't establish
      # media. Fine to leave unset for local dev.
      - DOCKER_HOST_ADDRESS=${JITSI_DOCKER_HOST_ADDRESS:-}

  # Recording (see IdentityVerificationCall's own docstring on why this
  # is manually triggered by the Notary, not orchestrated by RentShield
  # itself) -- writes finished recordings into the jibri-recordings
  # volume, shared with `webserver` below so
  # run_video_call_recording_ingest_task can pick them up.
  jitsi-jibri:
    image: jitsi/jibri:stable
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    shm_size: 2gb
    volumes:
      - jibri-recordings:/config/recordings
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JITSI_JIBRI_RECORDER_PASSWORD:-devsecret-jibri-recorder}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JITSI_JIBRI_XMPP_PASSWORD:-devsecret-jibri-xmpp}
      - JIBRI_BREWERY_MUC=jibribrewery
      - JIBRI_LOGS_DIR=/config/logs
      - JIBRI_RECORDING_DIR=/config/recordings
      - JIBRI_STRIP_DOMAIN_JID=muc.meet.jitsi
      - DISPLAY=:0

  # GPU-only — see deepseek-ocr-service/README.md. Not started by
  # `docker compose up` unless the "gpu" profile is enabled
  # (`docker compose --profile gpu up`), since it fails without a real
  # CUDA GPU + the NVIDIA Container Toolkit.
  deepseek-ocr-service:
    build:
      context: ./deepseek-ocr-service
    restart: unless-stopped
    profiles: ["gpu"]
    ports:
      - "8011:8011"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgx-data:
  pgx-media:
  redisdata:
  docuseal-data:
  opensign-mongo-data:
  opensign-files:
  jitsi-prosody-config:
  jibri-recordings:
  zitadel-db-data:
  zitadel-bootstrap:

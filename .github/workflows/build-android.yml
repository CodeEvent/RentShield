name: Build Android passport/CIE reader

# Unlike iOS, this needs no special runner and no paid account at all --
# NFC on Android has no entitlement gate, which is exactly why this is
# the active free path (see android/RentShieldPassportReader, and the
# now-dormant ios/RentShieldPassportReader kept for if an Apple Developer
# account ever becomes available).

on:
  push:
    paths:
      - "android/RentShieldPassportReader/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/RentShieldPassportReader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/RentShieldPassportReader/app/build/outputs/apk/debug/app-debug.apk
